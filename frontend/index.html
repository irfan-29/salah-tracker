    <script type="application/ld+json">

    <!--
      Theme before first paint.

      The theme is a per-account setting that lives behind /api/app/meta, which
      cannot answer until the bundle has run - by which time a dark-mode reader
      has already been shown a white page. So the last applied theme is mirrored
      into localStorage and replayed here, synchronously, before the stylesheet
      or any script loads. The app re-applies the authoritative value when meta
      arrives, and overwrites this key whenever the theme changes.

      Deliberately duplicated with THEME_STORAGE_KEY in hooks/useSession.jsx: an
      inline script cannot import from the bundle it is racing.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('salah-theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (err) {
          /* Storage can throw in private mode. The default theme still applies. */
        }
      })();
    </script>
    <!-- Bootstrap. The React app uses .form-floating, .d-flex,
         .justify-content-between, .gap-2, .text-muted, .bg-light, .p-2 and
         .table across several pages, but the React entry point never loaded it -
         only views/navbar.ejs did. That is why form labels sat beside the
         inputs instead of floating inside them. Same version and integrity
         hash as the EJS app, so both render identically. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

    <style>
      /*
        Initial-paint loader. Inline and dependency-free on purpose: this has to
        render before the CSS bundle and the JS bundle have downloaded, or the
        whole point of having it is lost. React removes #boot-loader once it has
        mounted, so there is no flash and no layout shift.

        Duplicated deliberately rather than shared with the app stylesheet - a
        <link> to a stylesheet that has not loaded yet cannot style anything.
        Kept byte-identical in behaviour to components/Loader.jsx.
      */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        gap: 0.875rem;
        background: #f8fafc;
      }
      #boot-loader[hidden] { display: none; }

      /*
        The loader has to respect the theme too. It is the first thing painted,
        so hard-coding a light background produced a full-screen white flash for
        dark-mode readers before the app took over - the exact thing the
        pre-paint script above exists to prevent.
      */
      [data-theme="dark"] #boot-loader { background: #0b1120; }
      [data-theme="dark"] #boot-loader .track { stroke: #1e293b; }
      [data-theme="dark"] #boot-loader .label { color: #94a3b8; }

      #boot-loader .ring {
        position: relative;
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
      }
      #boot-loader svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      #boot-loader circle { fill: none; stroke-width: 6; stroke-linecap: round; }
      #boot-loader .track { stroke: #e2e8f0; }
      #boot-loader .fill {
        stroke: #0d9488;
        animation: boot-fill 1.1s linear infinite;
      }
      #boot-loader .logo {
        color: #0d9488;
        font-family: 'Material Symbols Rounded';
        font-size: 34px;
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      #boot-loader .label {
        position: absolute;
        top: calc(50% + 52px);
        font-family: 'Mukta Malar', system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #64748b;
      }

      @keyframes boot-fill {
        0%   { stroke-dashoffset: 263; }
        50%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -263; }
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.94); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .fill { animation: none; stroke-dashoffset: 0; }
        #boot-loader .logo { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-busy="true" aria-live="polite">
      <div class="ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="42" />
          <circle class="fill" cx="50" cy="50" r="42"
                  stroke-dasharray="263.9" stroke-dashoffset="263.9" />
        </svg>
        <span class="logo">mosque</span>
      </div>
      <span class="label">Hasanath</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
